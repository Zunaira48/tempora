<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempora — Weather, simplified</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
      <span class="sidebar-toggle-icon">☰</span>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">◐</span>
        <span class="brand-name">Tempora</span>
      </div>

      <form class="search-bar" id="searchForm">
        <input
          type="text"
          id="cityInput"
          class="search-input"
          placeholder="Search for a city..."
          autocomplete="off"
        />
        <button type="submit" class="search-button">Search</button>
      </form>

      <div class="sidebar-section">
        <p class="sidebar-label">Recent</p>
        <div class="recent-searches" id="recentSearches"></div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-label">Favorites</p>
        <div class="favorite-searches" id="favoriteSearches"></div>
        <button type="button" id="favoriteCitiesTodayButton" class="favorite-cities-today-button" hidden>
          📍 Your Cities Today
        </button>
        <div id="favoriteCitiesTodayResult" class="favorite-cities-today-result"></div>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="icon-button" id="themeToggle" aria-label="Toggle dark mode">
          <span class="theme-icon">🌙</span>
        </button>
        <button type="button" class="icon-button" id="accountButton" aria-label="Account">
          <span class="account-icon">👤</span>
        </button>
      </div>
    </aside>

    <main class="dashboard">
      <section class="current-weather-card">
        <div class="location-info">
          <div class="city-name-row">
            <h1 class="city-name">Tempora</h1>
            <button type="button" class="favorite-button" id="favoriteButton" aria-label="Add to favorites">
              <span class="favorite-icon">☆</span>
            </button>
            <button type="button" class="tempo-ai-trigger" id="tempoAiButton" aria-label="Open Tempora AI">
              🤖 Tempora AI
            </button>
          </div>
          <p class="local-time">Loading weather…</p>
        </div>

        <div class="temperature-display">
          <span class="temperature-value">—°</span>
          <div class="condition-info">
            <span class="condition-text">—</span>
            <span class="feels-like">Feels like —°</span>
          </div>
        </div>

        <div class="unit-toggle" id="unitToggle">
          <button type="button" class="unit-option is-active" data-unit="c">°C</button>
          <button type="button" class="unit-option" data-unit="f">°F</button>
        </div>
      </section>

      <section class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <span class="stat-label">Humidity</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Wind</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Sunrise</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Sunset</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">UV Index</span>
          <span class="stat-value" id="uvValue">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Air Quality</span>
          <span class="stat-value" id="aqiValue">—</span>
        </div>
      </section>

      <section class="hourly-section">
        <h2 class="section-title">Next 24 Hours</h2>
        <div class="hourly-strip" id="hourlyStrip"></div>
      </section>

      <section class="forecast-section">
        <h2 class="section-title">5-Day Forecast</h2>
        <div class="forecast-grid" id="forecastGrid"></div>
      </section>
    </main>

    <div class="modal-overlay" id="authModalOverlay">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <h2 id="authModalTitle" class="sr-only">Log in or sign up</h2>
        <button type="button" class="modal-close" id="authModalClose" aria-label="Close">✕</button>

        <div class="modal-tabs">
          <button type="button" class="modal-tab is-active" id="loginTab">Log In</button>
          <button type="button" class="modal-tab" id="registerTab">Sign Up</button>
        </div>

        <form class="auth-form" id="loginForm">
          <input type="email" class="auth-input" id="loginEmail" placeholder="Email" required autocomplete="email" />
          <input type="password" class="auth-input" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
          <p class="auth-error" id="loginError" role="alert" aria-live="polite"></p>
          <button type="submit" class="auth-submit">Log In</button>
        </form>

        <form class="auth-form is-hidden" id="registerForm">
          <input type="email" class="auth-input" id="registerEmail" placeholder="Email" required autocomplete="email" />
          <input type="password" class="auth-input" id="registerPassword" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password" />
          <p class="auth-error" id="registerError" role="alert" aria-live="polite"></p>
          <button type="submit" class="auth-submit">Sign Up</button>
        </form>
      </div>
    </div>
  </div>

  <div id="tempoAiPanel" class="tempo-ai-panel" role="dialog" aria-modal="false" aria-labelledby="tempoAiTitle" hidden>
    <div class="tempo-ai-header">
      <h2 id="tempoAiTitle">🤖 Tempora AI</h2>
      <button type="button" id="tempoAiClose" class="modal-close" aria-label="Close Tempora AI">✕</button>
    </div>

    <div class="tempo-ai-tabs">
      <button type="button" class="tempo-ai-tab is-active" data-tab="chat">💬 Chat</button>
      <button type="button" class="tempo-ai-tab" data-tab="explain">📋 Explain</button>
      <button type="button" class="tempo-ai-tab" data-tab="activities">🏃 Activities</button>
      <button type="button" class="tempo-ai-tab" data-tab="plan">📅 Plan</button>
      <button type="button" class="tempo-ai-tab" data-tab="compare">⚖️ Compare</button>
    </div>

    <div class="tempo-ai-tab-panel" data-tab-panel="chat">
      <div id="copilotMessages" class="copilot-messages" aria-live="polite"></div>
      <form id="copilotForm" class="copilot-form">
        <input type="text" id="copilotInput" placeholder="Ask Tempora..." maxlength="500" autocomplete="off" />
        <button type="submit" id="copilotSend">Ask</button>
      </form>
    </div>

    <div class="tempo-ai-tab-panel is-hidden" data-tab-panel="explain">
      <button type="button" id="explainWeatherButton" class="tempo-ai-action-button">
        Explain Current Weather
      </button>
      <div id="explainWeatherResult" class="explain-weather-result"></div>
    </div>

    <div class="tempo-ai-tab-panel is-hidden" data-tab-panel="activities">
      <div class="activity-grid">
        <button type="button" class="activity-btn" data-activity="running">🏃 Running</button>
        <button type="button" class="activity-btn" data-activity="walking">🚶 Walking</button>
        <button type="button" class="activity-btn" data-activity="cycling">🚴 Cycling</button>
        <button type="button" class="activity-btn" data-activity="beach">🏖 Beach</button>
        <button type="button" class="activity-btn" data-activity="photography">📸 Photography</button>
        <button type="button" class="activity-btn" data-activity="picnic">🧺 Picnic</button>
        <button type="button" class="activity-btn" data-activity="hiking">🌳 Hiking</button>
        <button type="button" class="activity-btn" data-activity="travel">✈️ Travel</button>
        <button type="button" class="activity-btn" data-activity="university">🎓 University</button>
        <button type="button" class="activity-btn" data-activity="outdoor_event">💍 Outdoor Event</button>
      </div>
      <div id="activityAdvisorResult" class="activity-result"></div>
    </div>

    <div class="tempo-ai-tab-panel is-hidden" data-tab-panel="plan">
      <form id="planMyDayForm" class="plan-form">
        <textarea
          id="planMyDayInput"
          class="plan-textarea"
          placeholder="Describe your day, e.g. 'University at 9am, lunch at 1pm, exercise in the evening'"
          maxlength="500"
          rows="3"
        ></textarea>
        <button type="submit" id="planMyDaySubmit" class="tempo-ai-action-button">Plan My Day</button>
      </form>
      <div id="planMyDayResult" class="plan-result"></div>
    </div>

    <div class="tempo-ai-tab-panel is-hidden" data-tab-panel="compare">
      <form id="compareCitiesForm" class="compare-form">
        <input type="text" id="compareCityA" class="compare-input" placeholder="First city" maxlength="100" autocomplete="off" />
        <input type="text" id="compareCityB" class="compare-input" placeholder="Second city" maxlength="100" autocomplete="off" />
        <input type="text" id="comparePurpose" class="compare-input" placeholder="Purpose (optional) — e.g. weekend trip" maxlength="200" autocomplete="off" />
        <button type="submit" id="compareCitiesSubmit" class="tempo-ai-action-button">Compare</button>
      </form>
      <div id="compareCitiesResult" class="compare-result"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tempo-ai.js"></script>
</body>
</html>
